[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dunefastsim"
version = "0.0.11"
description = "JAX fast simulation of the DUNE Near Detector (ND-LAr charge and light) for light-dark-matter studies"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"  # lumen 0.2 and jax 0.6.2: Python <=3.13
dependencies = ["numpy", "h5py", "pyyaml"]

[project.optional-dependencies]
# JAX at the version lumen 0.2 pins exactly (JAXTPC accepts >=0.4,<0.7). GPU: jax[cuda12]==0.6.2.
jax = ["jax==0.6.2"]
# Light: lumen-tpc (DUNE ND-LAr recipe) pulls lumen v0.2.0 from git. Linux only (CUDA 12, or g++ with OpenMP).
light = ["lumen-tpc @ git+https://github.com/OmarAlterkait/lumen-tpc.git@66032a0a71b4369f07661427f8d2fc4d2d81267d"]
# LDM events and the edep-sim job: bdnmc-dune (also gives the GDML reader used by dunefastsim.geometry).
ldm = ["bdnmc-dune @ git+https://github.com/RobMina/bdnmc-dune.git@165be9ebd7cd8a6dbb1038e7ed3c62ea36235955"]
# Option B transport: hep-simkernels (Geant4-matched e+- kernels; needs hep-simlib installed first, same pins as
# mu2e-fastsim's core).
transport = ["hep-simlib @ git+https://github.com/RobMina/hep-simlib.git@b5868350f789f49dfc174110e72d55a40758de67",
             "hep-simkernels @ git+https://github.com/RobMina/hep-simkernels.git@2c3f0d4e74d31e79f72e37a346d561b306443db5"]
test = ["pytest"]
# Charge (JAXTPC) is NOT an extra: it has no licence yet and only supports an editable install from a checkout.
# Clone it at dunefastsim.charge.JAXTPC_PIN, `pip install -e` it, and set JAXTPC_ROOT (see README).

[project.scripts]
dunefastsim = "dunefastsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dunefastsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
